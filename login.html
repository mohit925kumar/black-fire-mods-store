<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Black Fire Store Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAE3LEjwh3ZJGwzvpyjKiIfcXBUasYfFec",
            authDomain: "teligram-welcome-bot.firebaseapp.com",
            databaseURL: "https://teligram-welcome-bot-default-rtdb.firebaseio.com",
            projectId: "teligram-welcome-bot",
            storageBucket: "teligram-welcome-bot.firebasestorage.app",
            messagingSenderId: "728176803041",
            appId: "1:728176803041:web:53a9cdb701b58a6c248ba0"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseGet = get;
        window.firebaseChild = child;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #09090b 0%, #111827 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            width: 400px;
            height: 400px;
            background: #38bdf8;
            top: -100px;
            left: -100px;
        }
        .blob-2 {
            width: 300px;
            height: 300px;
            background: #818cf8;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .login-container {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.1);
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(11, 17, 32, 0.6);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            background: rgba(11, 17, 32, 0.9);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.6);
        }
        .btn:active {
            transform: translateY(0);
        }
        
        .error-msg {
            color: #f87171;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
            background: rgba(127, 29, 29, 0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #b91c1c;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="logo">🔥 Black Fire Store</div>
        <div class="subtitle">Admin Panel Login</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">
                <span id="btnText">Login</span>
                <div class="spinner" id="spinner"></div>
            </button>
            <div id="errorMsg" class="error-msg">❌ Invalid Username or Password!</div>
        </form>
    </div>

    <script>
        // Check if already logged in
        if(localStorage.getItem('ffglory_user')) {
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            // Reset error
            errorMsg.style.display = 'none';

            if(!window.firebaseDB) {
                alert("Firebase loading... Please try again.");
                return;
            }

            // Show Loading
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.disabled = true;

            // Firebase me 'web_users' node check karo
            const dbRef = window.firebaseRef(window.firebaseDB);
            window.firebaseGet(window.firebaseChild(dbRef, 'web_users/' + username)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.password === password) {
                        // Login Success
                        localStorage.setItem('ffglory_user', username);
                        window.location.href = 'index.html';
                    } else {
                        showError();
                    }
                } else {
                    showError();
                }
            }).catch((error) => {
                console.error(error);
                showError();
            });

            function showError() {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                btn.disabled = false;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
